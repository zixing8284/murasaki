name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; do not cancel in-progress runs so a
# finished deploy is not orphaned by a newer push.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Project page subpath served by GitHub Pages
  # (https://zixing8284.github.io/murasaki/).
  DEPLOY_BASE_PATH: /murasaki

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
            node-version: 22
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm ui:test

      - run: pnpm ui:build

      - name: Build docs (with Pages base path)
        run: pnpm docs:build

      - name: Embed docs into playground public/
        run: pnpm docs:embed

      - name: Build playground (with Pages base path)
        run: pnpm play:build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
