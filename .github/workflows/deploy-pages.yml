name: Deploy Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; do not cancel in-progress runs so a
# finished deploy is not orphaned by a newer push.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Opt in early to Node 24 for all JavaScript actions in this workflow.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # Project page subpath served by GitHub Pages
  # (https://zixing8284.github.io/murasaki/).
  DEPLOY_BASE_PATH: /murasaki

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm ui:build

      - name: Build docs (with Pages base path)
        run: pnpm docs:build

      - name: Embed docs into playground public/
        run: pnpm docs:embed

      - name: Build playground (with Pages base path)
        run: pnpm play:build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
