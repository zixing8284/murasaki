name: Release @murasaki-io/react98

on:
  push:
    branches: [main]
    paths:
      - .changeset/**
      - .github/workflows/publish.yml
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release-react98:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history is required for changesets to generate correct release notes
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Build @murasaki-io/react98
        run: pnpm ui:build

      - name: Create version PR or publish @murasaki-io/react98
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: "chore(release): version @murasaki-io/react98"
          pr-title: "chore(release): version @murasaki-io/react98"
          create-github-releases: true
          push-with-git-cli: false
        env:
          # Required by setup-node's generated .npmrc for npm publish auth
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
