name: Release @murasaki-io/react98

on:
  push:
    branches: [main]
    paths:
      - .changeset/**
      - .github/workflows/publish.yml
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release-react98:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Build @murasaki-io/react98
        run: pnpm ui:build

      - name: Create version PR or publish @murasaki-io/react98
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore(release): version @murasaki-io/react98"
          title: "chore(release): version @murasaki-io/react98"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
